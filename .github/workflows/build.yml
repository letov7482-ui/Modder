name: Build PUBG Mod PAK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set version variables
      id: ver
      shell: bash
      run: |
        VERSION="4.6.0.21572"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "pak_name=game_patch_${VERSION}.pak" >> $GITHUB_OUTPUT

    - name: Download UnrealPak
      shell: pwsh
      run: |
        $urls = @(
          "https://github.com/RedxEYE/UnrealPakTool/releases/download/v1.0.0/UnrealPak.exe",
          "https://github.com/UE4Modding/UnrealPak/releases/download/v1/UnrealPak.exe",
          "https://github.com/FabianFG/UnrealPakTool/releases/download/v1.0/UnrealPak.exe"
        )
        
        New-Item -Path "tools" -ItemType Directory -Force
        $success = $false
        
        foreach ($url in $urls) {
          try {
            Write-Host "Trying to download from: $url"
            Invoke-WebRequest -Uri $url -OutFile "tools\UnrealPak.exe" -ErrorAction Stop
            if (Test-Path "tools\UnrealPak.exe") {
              $success = $true
              Write-Host "Downloaded successfully from $url"
              break
            }
          } catch {
            Write-Host "Failed: $($_.Exception.Message)"
          }
        }
        
        if (-not $success) {
          Write-Error "Could not download UnrealPak.exe from any source"
          exit 1
        }

    - name: Generate manifest dynamically
      shell: pwsh
      run: |
        New-Item -Path "tools" -ItemType Directory -Force
        $lines = @()
        $lines += '"../../../ShadowTrackerExtra/Content/Lua/ModEntry.lua" "src\ModEntry.lua"'
        $lines += '"../../../ShadowTrackerExtra/Content/Lua/hooks.lua" "src\hooks.lua"'
        
        $bypassDir = "src\bypasses"
        if (Test-Path $bypassDir) {
          Get-ChildItem -Path $bypassDir -Filter *.lua | ForEach-Object {
            $name = $_.BaseName
            $lines += '"../../../ShadowTrackerExtra/Content/Lua/bypasses/' + $name + '.lua" "src\bypasses\' + $name + '.lua"'
          }
        }
        
        Set-Content -Path "tools\manifest.txt" -Value $lines
        Write-Host "Manifest generated:"
        Get-Content "tools\manifest.txt"

    - name: Pack PAK
      shell: cmd
      run: |
        mkdir build
        tools\UnrealPak.exe build\${{ steps.ver.outputs.pak_name }} -create=tools\manifest.txt -compress

    - name: Verify PAK
      shell: cmd
      run: |
        tools\UnrealPak.exe -Test build\${{ steps.ver.outputs.pak_name }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.ver.outputs.pak_name }}
        path: build/${{ steps.ver.outputs.pak_name }}

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.ver.outputs.version }}
        files: build/${{ steps.ver.outputs.pak_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
