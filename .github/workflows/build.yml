    - name: Create PAK Packager Script
      shell: pwsh
      run: |
        New-Item -Path "tools" -ItemType Directory -Force
        Set-Content -Path "tools\pack_pak.py" -Value @"
        import os, struct, hashlib, sys

        def pack_pak(src_dir, mount_point, out_file):
            magic = 0x5A6F12E1
            version = 4
            
            files = []
            for root, _, fns in os.walk(src_dir):
                for fn in fns:
                    fp = os.path.join(root, fn)
                    rel_path = os.path.relpath(fp, src_dir).replace('\\\\', '/')
                    files.append((rel_path, fp))
            
            header_size = 221
            data_offset = header_size
            file_data = b''
            index_entries = []
            
            for rel, fp in files:
                with open(fp, 'rb') as f:
                    content = f.read()
                
                entry_offset = data_offset + len(file_data)
                entry_size = len(content)
                entry_hash = hashlib.sha1(content).digest()
                
                file_data += content
                
                full_path = mount_point + rel
                name_bytes = full_path.encode('utf-8') + b'\x00'
                
                entry = struct.pack('<I', len(name_bytes)) + name_bytes
                entry += struct.pack('<Q', entry_offset)
                entry += struct.pack('<Q', entry_size)
                entry += struct.pack('<Q', entry_size)
                entry += struct.pack('<I', 0x00000000)
                entry += struct.pack('<I', 0x00000000)
                entry += entry_hash
                
                index_entries.append(entry)
            
            mount_bytes = mount_point.encode('utf-8') + b'\x00'
            index_data = struct.pack('<I', len(mount_bytes)) + mount_bytes
            index_data += struct.pack('<I', len(files))
            for e in index_entries:
                index_data += e
            
            index_offset = header_size + len(file_data)
            index_size = len(index_data)
            
            header = struct.pack('<I', magic)
            header += struct.pack('<I', version)
            header += struct.pack('<Q', index_offset)
            header += struct.pack('<Q', index_size)
            header += b'\x00' * 20
            header += b'\x00' * 32
            
            with open(out_file, 'wb') as f:
                f.write(header)
                f.write(file_data)
                f.write(index_data)
            
            print(f"Packed {len(files)} files into {out_file}")

        pack_pak(sys.argv[1], sys.argv[2], sys.argv[3])
        "@
