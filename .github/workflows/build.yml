name: Build PUBG Mod PAK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set version variables
      id: ver
      shell: bash
      run: |
        VERSION="4.6.0.21572"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "pak_name=game_patch_${VERSION}.pak" >> $GITHUB_OUTPUT

    - name: Create Directories
      shell: bash
      run: mkdir -p tools build tmp_mod

    - name: Create Encryptor Script
      shell: bash
      run: |
        echo "" | base64 -d > tools/encrypt.py

    - name: Create PAK Packager Script
      shell: bash
      run: |
        echo "" | base64 -d > tools/pack_pak.py

    - name: Encrypt and Pack PAK
      shell: pwsh
      run: |
        python tools\encrypt.py "src" "tmp_mod\Loader.lua"
        
        $mountPoint = "../../../ShadowTrackerExtra/Content/Lua/"
        python tools\pack_pak.py "tmp_mod" $mountPoint "build\${{ steps.ver.outputs.pak_name }}"
        
        Write-Host "Encrypted PAK built successfully:"
        Get-ChildItem build\

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.ver.outputs.pak_name }}
        path: build/${{ steps.ver.outputs.pak_name }}

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.ver.outputs.version }}
        files: build/${{ steps.ver.outputs.pak_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
